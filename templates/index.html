<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReefRecon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header class="hero">
      <h1>Reef&#8209;Recon</h1>
      <p class="tagline">Pi Control Panel</p>
    </header>

    <svg class="reef-band" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
      <rect width="400" height="28" fill="var(--ice)"/>
      <ellipse cx="18" cy="8" rx="16" ry="6" fill="var(--navy-700)" transform="rotate(-10 18 8)"/>
      <ellipse cx="55" cy="18" rx="12" ry="5" fill="var(--gold)" transform="rotate(8 55 18)"/>
      <ellipse cx="92" cy="6" rx="20" ry="7" fill="var(--blue)" transform="rotate(-5 92 6)"/>
      <ellipse cx="130" cy="20" rx="14" ry="5" fill="var(--navy-700)" transform="rotate(12 130 20)"/>
      <ellipse cx="168" cy="9" rx="18" ry="6" fill="var(--blue-light)" transform="rotate(-8 168 9)"/>
      <ellipse cx="205" cy="19" rx="13" ry="5" fill="var(--gold)" transform="rotate(6 205 19)"/>
      <ellipse cx="240" cy="7" rx="17" ry="6" fill="var(--navy-700)" transform="rotate(-12 240 7)"/>
      <ellipse cx="278" cy="18" rx="15" ry="6" fill="var(--blue)" transform="rotate(9 278 18)"/>
      <ellipse cx="315" cy="8" rx="19" ry="7" fill="var(--blue-light)" transform="rotate(-6 315 8)"/>
      <ellipse cx="352" cy="19" rx="14" ry="5" fill="var(--gold)" transform="rotate(10 352 19)"/>
      <ellipse cx="386" cy="7" rx="16" ry="6" fill="var(--navy-700)" transform="rotate(-9 386 7)"/>
    </svg>

    <section class="card">
      <div class="card-head">
        <h2>Recording</h2>
        <span id="recording-dot" class="dot"></span>
      </div>
      <p id="recording-status" class="status-line">Checking status&hellip;</p>
      <div class="buttons">
        <button id="recording-start-btn" class="btn-go" disabled>Start recording</button>
        <button id="recording-stop-btn" class="btn-stop" disabled>Stop recording</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Test Tone</h2>
        <span id="playback-dot" class="dot"></span>
      </div>
      <p id="playback-status" class="status-line">Checking status&hellip;</p>
      <div class="buttons">
        <button id="play-btn" class="btn-go" disabled>Play white noise</button>
        <button id="stop-btn" class="btn-stop" disabled>Stop</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Noise Filter Preset</h2>
      </div>
      <p id="preset-status" class="status-line">Checking status&hellip;</p>
      <div class="buttons preset-grid">
        <button data-preset="balanced" class="btn-neutral" disabled>Balanced</button>
        <button data-preset="noise_hunter" class="btn-neutral" disabled>Noise Hunter</button>
        <button data-preset="sensitive" class="btn-neutral" disabled>Sensitive</button>
        <button data-preset="low_freq_focus" class="btn-neutral" disabled>Low Freq Focus</button>
        <button data-preset="shrimp_focus" class="btn-neutral" disabled>Shrimp Focus</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Diagnostic Mode</h2>
        <span id="diagnostic-dot" class="dot"></span>
      </div>
      <p id="diagnostic-status" class="status-line">Checking status&hellip;</p>
      <div class="buttons">
        <button id="diagnostic-on-btn" class="btn-go" disabled>Enable</button>
        <button id="diagnostic-off-btn" class="btn-stop" disabled>Disable</button>
      </div>
    </section>

    <section class="card card-danger">
      <div class="card-head">
        <h2>Maintenance</h2>
      </div>
      <p id="reset-status" class="status-line">&nbsp;</p>
      <div class="buttons">
        <button id="reset-btn" class="btn-danger">Reset to defaults</button>
      </div>
    </section>

    <p id="error-banner" class="error hidden"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
