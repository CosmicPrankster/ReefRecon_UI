<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReefRecon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>ReefRecon</h1>

    <section>
      <h2>Recording</h2>
      <p id="recording-status">Checking status&hellip;</p>
      <div class="buttons">
        <button id="recording-start-btn">Start recording</button>
        <button id="recording-stop-btn">Stop recording</button>
      </div>
    </section>

    <section>
      <h2>Test tone</h2>
      <p id="playback-status">Checking status&hellip;</p>
      <div class="buttons">
        <button id="play-btn">Play white noise</button>
        <button id="stop-btn">Stop</button>
      </div>
    </section>

    <p id="error-banner" class="error hidden"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
